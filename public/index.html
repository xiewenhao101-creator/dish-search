<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>菜品搜索 · 教学视频 + 食材热量</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <h1>🍳 搜一道菜</h1>
    <p class="subtitle">输入菜名，立即获取 <b>教学视频</b>、<b>所需食材</b> 与 <b>热量计算</b></p>
    <form id="searchForm" class="search-bar">
      <input id="searchInput" type="text" placeholder="例如：宫保鸡丁 / 番茄炒蛋 / 红烧肉" autocomplete="off" />
      <button type="submit">搜索</button>
    </form>
    <div class="chips-area">
      <div class="chips-head">
        <span>🎲 随便吃点</span>
        <button id="refreshChips" class="refresh-btn" type="button" title="换一批随机菜品">↻ 换一批</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </header>

  <section class="cats-area container">
    <div class="cats-head">
      <span>📚 分类浏览</span>
      <span class="cats-sub">按食材 / 菜系快速挑一道</span>
    </div>
    <div class="cats" id="categories"></div>
  </section>

  <main id="result" class="container"></main>

  <footer class="foot">
    热量为估算值（基于常见食材每100g热量），仅供参考，不替代专业营养建议。
  </footer>

  <script src="app.js"></script>
</body>
</html>
